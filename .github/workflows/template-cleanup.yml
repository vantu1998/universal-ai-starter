name: Template Cleanup

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  cleanup:
    name: Initialize Project from Template
    if: github.repository != 'vantu1998/universal-ai-starter'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run template cleanup script
        run: bash .github/scripts/template-cleanup.sh
